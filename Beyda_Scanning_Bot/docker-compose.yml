# Full local development stack: the self-hosted Telegram Bot API server plus
# the security bot itself. The Vercel Mini App (miniapp/ + api/) is deployed
# separately to Vercel — see README.md.
#
# Usage:
#   cp .env.example .env   # then fill in the values
#   docker compose up --build

services:
  telegram-bot-api:
    build:
      context: ./telegram-bot-api
      dockerfile: Dockerfile
    environment:
      TELEGRAM_API_ID: "${TELEGRAM_API_ID:?Set TELEGRAM_API_ID in .env}"
      TELEGRAM_API_HASH: "${TELEGRAM_API_HASH:?Set TELEGRAM_API_HASH in .env}"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    env_file:
      - .env
    environment:
      USE_LOCAL_BOT_API: "true"
      TELEGRAM_LOCAL_API_URL: "http://telegram-bot-api:8081"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    depends_on:
      - telegram-bot-api
    restart: unless-stopped

volumes:
  telegram-bot-api-data: