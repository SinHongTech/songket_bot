          if (h && (h.indexOf('hash=') !== -1 || h.indexOf('tgWebAppData=') !== -1)) {
            window.__songket_init_raw = h;
            sessionStorage.setItem('songket_init_raw', h);

            localStorage.setItem('songket_init_raw', s);

          function extractInitString(data) {
            if (!data) return '';
            if (typeof data === 'string') {
              try { data = JSON.parse(data); } catch (e) {
                if (data.indexOf('hash=') !== -1) return data;
              }
            }
            if (!data || typeof data !== 'object') return '';
            var cand = data.initData || 
              (data.eventData && (typeof data.eventData === 'string' ? data.eventData : data.eventData.initData)) ||
              (data.data && data.data.initData) ||
              (data.event_data && data.event_data.init_data) || '';
            return typeof cand === 'string' ? cand : '';
          }

          window.addEventListener('message', function(event) {
            try {
              var str = extractInitString(event.data);

                window.__songket_init_data = str;
                sessionStorage.setItem('songket_init_data', str);
