<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/shared/assets/Logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Songket</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      (function() {
        try {
          var h = window.location.hash || '';
          var s = window.location.search || '';
          if (h && (h.indexOf('hash=') !== -1 || h.indexOf('tgWebAppData=') !== -1)) {
            sessionStorage.setItem('songket_init_raw', h);
          }
          if (s && (s.indexOf('hash=') !== -1 || s.indexOf('tgWebAppData=') !== -1)) {
            sessionStorage.setItem('songket_init_raw', s);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
